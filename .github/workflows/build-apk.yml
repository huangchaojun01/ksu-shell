name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract source zip
        run: |
          Z=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$Z" ]; then
            unzip -q -o "$Z" -x ".github/*"
            rm -f "$Z"
          fi
          if [ ! -f settings.gradle ]; then
            D=$(dirname "$(find . -name settings.gradle | head -1)")
            cp -r "$D"/. . 2>/dev/null
            rm -rf "${D%%/*}"
          fi
          rm -f local.properties
          sed -i '/aliyun/d' settings.gradle 2>/dev/null
          sed -i '/aapt2FromMavenOverride/d' gradle.properties 2>/dev/null
          ls

      - name: Build
        run: gradle :manager:app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: manager/app/build/outputs/apk/debug/app-debug.apk

